# Runs the two checks documented in mathutrice/README.md, "Running the check":
# every import crossing a package boundary reaches a public name, and no two
# packages import each other. They are the commands a contributor runs locally,
# so a red run here is reproducible with two lines in a terminal.
#
# Then the deploy that waits on them: a push to camille-lab3 whose checks pass
# is deployed to Fork staging, an App Service app whose settings and secrets
# are held in the GitHub Environment `staging`. It logs in to Azure through
# OpenID Connect: no Azure password or publish profile is stored anywhere.
name: Architecture

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  architecture:
    name: architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Pinned to a full version: setup-uv publishes no floating `v10` tag.
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      # uv installs the interpreter pinned in .python-version itself, so there
      # is no separate Python setup step to keep in sync with it. The dev group,
      # which is where tach lives, is part of a default sync.
      - run: uv sync

      # scripts/check_cycles.py reads the real import graph from `tach map`, and
      # both commands expect the directory holding tach.toml -- the checkout
      # root, which is where a step starts.
      - run: uv run tach check

      - run: uv run python scripts/check_cycles.py

  # The Lab 2 tests. Beside architecture, with no `needs:`: each check reports
  # on its own. conftest.py gives the LLM client dummy settings, so no `.env`.
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - run: uv sync

      - run: uv run pytest

  # Deploy on green: a push to the fork's default branch, once both checks
  # above have passed, is built into one image, tagged with its commit, and
  # deployed to Fork staging. Never on a pull request, nor on another branch.
  deploy-staging:
    name: deploy to staging
    needs: [architecture, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/camille-lab3'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    # One deploy at a time, in the order pushed; a newer push waiting replaces
    # an older one waiting.
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    environment:
      name: staging
      url: https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net
    steps:
      - uses: actions/checkout@v7

      # One image per commit, tagged with it, so that whatever runs can be
      # traced to the run that passed. A commit pushed twice is built once.
      # The label links the package to this repository on GHCR. REVISION is
      # the commit again, inside the image: the app sends it back in an
      # X-Revision header, so the deploy can tell which image answered.
      - name: Build and push the image, unless it exists
        id: image
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:$GITHUB_SHA"
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          if docker manifest inspect "$image" > /dev/null 2>&1; then
            echo "$image already built"
          else
            docker build \
              --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              --build-arg "REVISION=$GITHUB_SHA" \
              -t "$image" .
            docker push "$image"
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Log in to Azure
        uses: azure/login@v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy the image to staging
        uses: ./.github/actions/deploy-to-app-service
        with:
          image: ${{ steps.image.outputs.image }}
          resource-group: ${{ vars.AZURE_RESOURCE_GROUP }}
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          session-secret: ${{ secrets.SESSION_SECRET }}
          dev-login-key: ${{ secrets.DEV_LOGIN_KEY }}
          llm-base-url: https://api.mistral.ai/v1
          llm-api-key: ${{ secrets.LLM_API_KEY }}
